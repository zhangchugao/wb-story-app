          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginTop: 14 }}>
            {hot.map((h) => (
              <div key={h} onClick={() => setQ(h)} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 999, padding: '8px 16px', fontSize: 13, color: C.fg, cursor: 'pointer' }}>{h}</div>
            ))}
          </div>
          {/* 空状态：第一次打开什么都没有 */}
          <div style={{ marginTop: 26, textAlign: 'center' }}>
            <div style={{ width: 200, height: 150, margin: '0 auto', borderRadius: 18, overflow: 'hidden', border: `1px solid ${C.line}`, opacity: 0.9 }}>
              <img src={IMG.herovision} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
            </div>
            <div style={{ fontSize: 14.5, fontWeight: 600, marginTop: 14 }}>还没有听过故事</div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 6 }}>今晚挑第一个，从《月亮的秘密》开始刚好</div>
            <div onClick={() => s.open('detail')} style={{ display: 'inline-block', marginTop: 14, background: C.lamp, color: C.night1, fontSize: 13.5, fontWeight: 700, borderRadius: 999, padding: '10px 24px', cursor: 'pointer' }}>从今晚的第一个开始</div>
          </div>
        </div>
      )}
    </div>
  );
}

/* —— 屏：收听历史 —— */
function HistoryScreen({ state }) {
  const s = state;
  const groups = [
    { day: '今晚 · 11 月 23 日', items: [{ st: STORIES[0], pos: '听到 4:12', ratio: 0.42, time: '21:04 · 听了 12 分钟' }] },
    { day: '昨晚 · 11 月 22 日', items: [
      { st: STORIES[2], pos: '听到 2:03', ratio: 0.24, time: '20:31 · 听了 5 分钟' },
      { st: STORIES[1], pos: '讲完了', ratio: 1, time: '20:12 · 听了 5 分钟' },
    ] },
    { day: '11 月 20 日', items: [{ st: STORIES[3], pos: '听到 3:40', ratio: 0.19, time: '午休时 · 听了 8 分钟' }] },

  return (
    <div style={{ minHeight: '100%', background: `linear-gradient(180deg, ${C.night1}, ${C.night2})`, padding: '10px 20px 30px', color: C.fg }}>

        <div style={{ fontSize: 26, fontWeight: 700 }}>听过的晚上</div>
        <div style={{ fontSize: 12, color: C.faint, cursor: 'pointer' }}>只看没听完的</div>
      </div>
      {groups.map((g) => (
        <div key={g.day} style={{ marginTop: 20 }}>
          <div style={{ fontSize: 12.5, color: C.muted, marginBottom: 10 }}>{g.day}</div>
          {g.items.map((it, i) => (
            <div key={i} onClick={() => s.open('player')} style={{ display: 'flex', gap: 12, alignItems: 'center', background: C.card, border: `1px solid ${C.line}`, borderRadius: 16, padding: 12, marginBottom: 10, cursor: 'pointer' }}>
              <div style={{ width: 48, height: 48, borderRadius: 12, overflow: 'hidden', flexShrink: 0, opacity: it.ratio === 1 ? 0.55 : 1 }}>
                <img src={it.st.img} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontSize: 14.5, fontWeight: 600, color: it.ratio === 1 ? C.muted : C.fg }}>{it.st.title}</div>
                  <div style={{ fontSize: 12, color: C.faint }}>{it.pos}</div>
                </div>
                <div style={{ marginTop: 6 }}><ProgressBar ratio={it.ratio} /></div>
                <div style={{ fontSize: 12, color: C.faint, marginTop: 6 }}>{it.time}</div>
              </div>
              {it.ratio < 1 && (
                <div style={{ width: 34, height: 34, borderRadius: 999, background: C.lamp, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2.5 L9.5 6 L4 9.5 Z" fill={C.night1} /></svg>
                </div>
              )}
            </div>
          ))}
        </div>
      ))}
      <div style={{ marginTop: 24, textAlign: 'center', fontSize: 12, color: C.faint, cursor: 'pointer' }}>清空收听历史</div>
    </div>
  );
}

/* —— 手机容器：每台独立状态机 —— */
function Phone({ initial, initialDim }) {
  const [tab, setTab] = React.useState(initial === 'home' || initial === 'category' || initial === 'mine' ? initial : 'home');
  const [page, setPage] = React.useState(['player', 'detail', 'search', 'history'].includes(initial) ? initial : null);
  const state = {
    tab,
    setTab: (t) => { setTab(t); setPage(null); },
    open: (p) => setPage(p),
    back: () => setPage(null),
  };
  const tabBar = { list: TAB_LIST, color: C.muted, selectedColor: C.lamp, backgroundColor: '#121D36' };
  const screens = { home: HomeScreen, category: CategoryScreen, mine: MineScreen };
  const pages = { player: PlayerScreen, detail: DetailScreen, search: SearchScreen, history: HistoryScreen };
  const PageComp = page ? (pages[page] || HomeScreen) : (screens[tab] || HomeScreen);
  const titles = { home: '听故事', category: '分类', mine: '我的', player: '正在听', detail: '故事详情', search: '搜索', history: '听过的晚上' };
  const path = { home: 'pages/index/index', category: 'pages/category/category', mine: 'pages/mine/mine', player: 'pages/player/player', detail: 'pages/detail/detail', search: 'pages/search/search', history: 'pages/history/history' };
  const isPage = !!page;
  return (
    <WechatFrame
      page={path[page || tab]} title={titles[page || tab]} home={!page && tab === 'home'}
      navColor={isPage ? C.night2 : C.night1} navText="white"
      back={isPage} onBack={state.back}
      tab={page ? undefined : tab} tabBar={page ? undefined : tabBar} onTabChange={state.setTab}
      background={C.night1}
    >
      <PageComp state={state} initialDim={initialDim} />
    </WechatFrame>
  );
}
