<script type="text/babel">
/* ============ 外壳：WechatFrame + Showboard（来自 huashu-design skill） ============ */
const wechatFrameStyles = {
  wrapper: { display: 'inline-block', padding: 10, background: '#0b0b0c', borderRadius: 54, boxShadow: '0 0 0 1.5px #2a2a2e, 0 24px 60px rgba(0,0,0,0.28)' },
  screen: { position: 'relative', borderRadius: 44, overflow: 'hidden' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 44, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 26px 0 30px', fontSize: 15, fontWeight: 600, fontFamily: '-apple-system, "SF Pro Text", "PingFang SC", sans-serif', zIndex: 40, pointerEvents: 'none' },
  nav: { position: 'absolute', top: 44, left: 0, right: 0, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 30, fontFamily: '-apple-system, "PingFang SC", sans-serif' },
  navTitle: { fontSize: 17, fontWeight: 500, maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' },
  back: { position: 'absolute', left: 6, top: 0, width: 40, height: 40, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' },
  capsule: { position: 'absolute', top: 48, right: 7, width: 87, height: 32, boxSizing: 'border-box', borderRadius: 16, display: 'flex', alignItems: 'center', zIndex: 50, pointerEvents: 'none' },
  capsuleHalf: { flex: 1, height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' },
  capsuleSep: { width: 0.5, height: 18 },
  tabBar: { position: 'absolute', left: 0, right: 0, bottom: 0, height: 49 + 34, paddingBottom: 34, boxSizing: 'border-box', display: 'flex', zIndex: 30, fontFamily: '-apple-system, "PingFang SC", sans-serif' },
  tabItem: { flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 3, fontSize: 10, cursor: 'pointer' },
  homeIndicator: { position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)', width: 134, height: 5, borderRadius: 999, zIndex: 60, pointerEvents: 'none' },
};
function WechatCapsule({ dark }) {
  const fg = dark ? '#000' : '#fff';
  const bg = dark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.15)';
  const bd = dark ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.25)';
  return (
    <div data-mp-capsule="" data-lint-skip="" style={{ ...wechatFrameStyles.capsule, background: bg, border: `0.5px solid ${bd}` }}>
      <div style={wechatFrameStyles.capsuleHalf}>
        <svg width="20" height="6" viewBox="0 0 20 6"><circle cx="3" cy="3" r="2" fill={fg} /><circle cx="10" cy="3" r="2.6" fill={fg} /><circle cx="17" cy="3" r="2" fill={fg} /></svg>
      </div>
      <div style={{ ...wechatFrameStyles.capsuleSep, background: bd }} />
      <div style={wechatFrameStyles.capsuleHalf}>
        <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke={fg} strokeWidth="1.6" /><circle cx="9" cy="9" r="2.6" fill={fg} /></svg>
      </div>
    </div>
  );
}
function WechatTabBar({ list, active, onChange, color = '#7A7E83', selectedColor = '#111111', backgroundColor = '#ffffff' }) {
  return (
    <div data-mp-tabbar="native" data-lint-skip="" style={{ ...wechatFrameStyles.tabBar, background: backgroundColor, borderTop: '0.5px solid rgba(0,0,0,0.12)' }}>
      {list.map(it => {
        const on = it.text === active;
        return (
          <div key={it.text} style={{ ...wechatFrameStyles.tabItem, color: on ? selectedColor : color }} onClick={() => onChange && onChange(it.text)}>
            {it.icon ? (typeof it.icon === 'function' ? it.icon(on) : it.icon) : <div style={{ width: 24, height: 24, borderRadius: 6, background: 'currentColor', opacity: on ? 1 : 0.35 }} />}
            <span>{it.text}</span>
          </div>
        );
      })}
    </div>
  );
}
function wechatIsDark(css) {
  const m = (css || '').match(/\d+(\.\d+)?/g);
  if (!m) return false;
  const [r, g, b] = m.map(Number);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b < 140;
}
function WechatFrame({ children, page = 'pages/index/index', title = '', home = false, nav = 'default', navColor = '#ffffff', navText = 'black', back = false, onBack, tab, tabBar, onTabChange, footer, background = '#ffffff', width = 375, height = 812, time = '9:41' }) {
  const statusColor = navText === 'white' ? '#fff' : '#000';
  const hasNativeTab = tabBar && tabBar.list && tabBar.list.length;
  const top = 84;
  const bottom = hasNativeTab ? 83 : 0;
  const footRef = React.useRef(null);
  const [footH, setFootH] = React.useState(0);
  const [footBg, setFootBg] = React.useState(null);
  React.useLayoutEffect(() => {
    const el = footRef.current;
    setFootH(el ? el.offsetHeight : 0);
    const c = el && el.firstElementChild ? getComputedStyle(el.firstElementChild).backgroundColor : null;
    setFootBg(c && c !== 'rgba(0, 0, 0, 0)' && c !== 'transparent' ? c : null);
  });
  return (
    <div style={wechatFrameStyles.wrapper}>
      <div style={{ ...wechatFrameStyles.screen, width, height, background }}
        data-mp-page={page} data-mp-title={title} data-mp-home={home ? '1' : ''} data-mp-nav={nav}
        data-mp-nav-color={navColor} data-mp-nav-text={navText} data-mp-tab={tab || ''}
        data-mp-tabbar-config={hasNativeTab ? JSON.stringify({ list: tabBar.list.map(t => t.text), color: tabBar.color || '#7A7E83', selectedColor: tabBar.selectedColor || '#111111', backgroundColor: tabBar.backgroundColor || '#ffffff' }) : ''}>
        <div data-mp-chrome="" data-lint-skip="" style={{ ...wechatFrameStyles.statusBar, color: statusColor }}>
          <span>{time}</span>
          <svg width="66" height="12" viewBox="0 0 66 12" fill={statusColor}>
            <rect x="0" y="8" width="3" height="4" rx="1" /><rect x="5" y="6" width="3" height="6" rx="1" /><rect x="10" y="3" width="3" height="9" rx="1" /><rect x="15" y="0" width="3" height="12" rx="1" />
            <path d="M30 11.2a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4zM25.6 6.4a6.4 6.4 0 018.8 0l-1.1 1.1a4.8 4.8 0 00-6.6 0zM23 3.8a10 10 0 0114 0l-1.1 1.1a8.4 8.4 0 00-11.8 0z" />
            <rect x="41" y="0.75" width="22" height="10.5" rx="3" fill="none" stroke={statusColor} strokeOpacity="0.45" strokeWidth="1" /><rect x="43" y="2.75" width="16" height="6.5" rx="1.5" /><rect x="64" y="4" width="1.5" height="4" rx="0.75" fillOpacity="0.45" />
          </svg>
        </div>
        {nav === 'default' && <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: top, background: navColor, zIndex: 25 }} />}
        {nav === 'default' && (
          <div style={{ ...wechatFrameStyles.nav, color: statusColor }}>
            {back && (
              <div style={wechatFrameStyles.back} onClick={onBack}>
                <svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke={statusColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>
              </div>
            )}
            <div style={wechatFrameStyles.navTitle}>{title}</div>
          </div>
        )}
        <WechatCapsule dark={navText !== 'white'} />
        <div data-mp-scroll="" style={{ position: 'absolute', top: nav === 'default' ? top : 0, left: 0, right: 0, bottom: bottom + footH, overflow: 'auto' }}>
          {children}
        </div>
        {footer && <div ref={footRef} data-mp-footer="" style={{ position: 'absolute', left: 0, right: 0, bottom, zIndex: 40, paddingBottom: hasNativeTab ? 0 : 34, background: footBg || background }}>{footer}</div>}
        {hasNativeTab && <WechatTabBar {...tabBar} active={tab} onChange={onTabChange} />}
        <div style={{ ...wechatFrameStyles.homeIndicator, background: (!hasNativeTab && (footBg ? wechatIsDark(footBg) : navText === 'white')) ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.85)' }} />
      </div>
    </div>
  );
}
function WechatShareCard({ appName, title, icon, children, width = 236 }) {
  const imgW = width - 16;
  return (
    <div style={{ width, background: '#fff', borderRadius: 6, padding: '10px 8px 0', boxSizing: 'border-box', fontFamily: '-apple-system, "PingFang SC", sans-serif', boxShadow: '0 1px 2px rgba(0,0,0,0.08)' }}>
      <div data-lint-skip="" style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#888', marginBottom: 6 }}>
        <div style={{ width: 16, height: 16, borderRadius: 999, overflow: 'hidden', background: '#eee', flexShrink: 0 }}>{icon}</div>
        <span>{appName}</span>
      </div>
      <div style={{ fontSize: 14, color: '#111', lineHeight: 1.4, marginBottom: 8, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{title}</div>
      <div data-mp-share="" style={{ width: imgW, height: imgW * 4 / 5, overflow: 'hidden', background: '#f2f2f2', position: 'relative' }}>{children}</div>
      <div data-lint-skip="" style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 11, color: '#999', borderTop: '0.5px solid #eee', marginTop: 8, padding: '6px 0' }}>
        <svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="#7d7df0" strokeWidth="1.4" /><circle cx="6" cy="6" r="1.8" fill="#7d7df0" /></svg>
        <span>小程序</span>
      </div>
    </div>
  );
}
function ShowboardLabel({ s, theme, width }) {
  return (
    <div style={{ width, marginBottom: 10 }}>
      <div style={{ fontSize: 15, fontWeight: 700, color: theme.fg, lineHeight: 1.3 }}>{s.label}</div>
      {s.note && <div style={{ fontSize: 13, color: theme.muted, lineHeight: 1.5, marginTop: 2 }}>{s.note}</div>}
    </div>
  );
}
function ShowboardPhone({ s, theme, x, y, scale, phoneW, phoneH }) {
  return (
    <div style={{ position: 'absolute', left: x, top: y, width: phoneW * scale }}>
      <ShowboardLabel s={s} theme={theme} width={phoneW * scale} />
      <div style={{ width: phoneW * scale, height: phoneH * scale }}>
        <div style={{ transform: `scale(${scale})`, transformOrigin: '0 0', width: phoneW }}>{s.node}</div>
      </div>
    </div>
  );
}
function Showboard({ layout = 'hero', theme = {}, title, kicker, lede, screens = [], closeup, aside, phoneW = 395, phoneH = 832, footnote }) {
  const t = { bg: '#F2F1EC', fg: '#1B1B1B', muted: '#6B6B66', accent: '#C2410C', font: 'inherit', ...theme };
  const W = 1440, M = 56;
  const mainIdx = Math.max(0, screens.findIndex((s) => s.main));
  const main = screens[mainIdx], rest = screens.filter((_, i) => i !== mainIdx);
  const LABEL = 56;
  const placed = [];
  let lines = [], close = null, asidePos = null, height = 0;
  if (layout === 'hero') {
    const big = 0.95, small = 0.76;
    const my = 250;
    placed.push({ s: main, x: M, y: my, scale: big });
    const colX = [M + phoneW * big + 56, M + phoneW * big + 56 + phoneW * small + 36];
    rest.forEach((s, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      placed.push({ s, x: colX[col], y: my - 40 + (col ? 140 : 0) + row * (phoneH * small + LABEL + 36), scale: small });
    });
    asidePos = { x: colX[1] + phoneW * small + 56, y: my + 40, w: W - M - (colX[1] + phoneW * small + 56) };
  } else if (layout === 'flow') {
    const sc = 0.8, step = phoneW * sc + 70;
    const perRow = Math.max(1, Math.floor((W - 2 * M + 70) / step));
    screens.forEach((s, i) => {
      const row = Math.floor(i / perRow), col = i % perRow;
      const x = M + col * step, y = 250 + row * (phoneH * sc + LABEL + 90) + col * 46;
      placed.push({ s, x, y, scale: sc });
      if (i > 0 && col > 0) {
        const p = placed[i - 1];
        lines.push({ x1: p.x + phoneW * sc - 6, y1: p.y + LABEL + phoneH * sc * 0.55, x2: x + 6, y2: y + LABEL + phoneH * sc * 0.45, via: s.via });
      }
    });
    asidePos = { x: W - M - 300, y: 40, w: 300 };
  } else {
    const sc = 1.0;
    placed.push({ s: main, x: M, y: 240, scale: sc });
    const cx = M + phoneW * sc + 60, cw = 520;
    close = { x: cx, y: 240, w: cw };
    rest.slice(0, 3).forEach((s, i) => placed.push({ s, x: cx + cw + 56, y: 150 + i * (phoneH * 0.62 + LABEL + 24), scale: 0.62 }));
    rest.slice(3).forEach((s, i) => placed.push({ s, x: cx + i * (phoneW * 0.62 + 30), y: 240 + LABEL + 560 + 40, scale: 0.62 }));
    asidePos = { x: cx, y: 40, w: cw };
  }
  placed.forEach((p) => { height = Math.max(height, p.y + LABEL + phoneH * p.scale + M); });
  if (close) height = Math.max(height, close.y + 600);
  return (
    <div data-showboard={layout} style={{ position: 'relative', width: W, height, background: t.bg, color: t.fg, fontFamily: t.font, overflow: 'hidden' }}>
      <div style={{ position: 'absolute', left: M, top: 56, width: layout === 'closeup' ? 340 : 760 }}>
        {kicker && <div style={{ fontSize: 14, color: t.accent, fontWeight: 700, marginBottom: 10 }}>{kicker}</div>}
        <div style={{ fontSize: layout === 'flow' ? 64 : 56, fontWeight: 800, lineHeight: 1.05 }}>{title}</div>
        {lede && <div style={{ fontSize: 16, lineHeight: 1.65, color: t.fg, opacity: 0.86, marginTop: 18 }}>{lede}</div>}
      </div>
      {lines.length > 0 && (
        <svg width={W} height={height} style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
          {lines.map((l, i) => (
            <g key={i}>
              <path d={`M${l.x1},${l.y1} C${(l.x1 + l.x2) / 2},${l.y1} ${(l.x1 + l.x2) / 2},${l.y2} ${l.x2},${l.y2}`} fill="none" stroke={t.accent} strokeWidth="2" strokeDasharray="5 5" />
              <circle cx={l.x2} cy={l.y2} r="4" fill={t.accent} />
              {l.via && <text x={(l.x1 + l.x2) / 2} y={(l.y1 + l.y2) / 2 - 10} textAnchor="middle" fontSize="13" fill={t.muted}>{l.via}</text>}
            </g>
          ))}
        </svg>
      )}
      {placed.map((p, i) => <ShowboardPhone key={i} {...p} theme={t} phoneW={phoneW} phoneH={phoneH} />)}
      {close && closeup && (
        <div style={{ position: 'absolute', left: close.x, top: close.y, width: close.w }}>
          <ShowboardLabel s={closeup} theme={t} width={close.w} />
          <div style={{ width: close.w, height: 560, overflow: 'hidden', borderRadius: 18, background: t.fg === '#1B1B1B' ? '#fff' : 'rgba(255,255,255,0.06)', padding: 24 }}>
            <div style={{ zoom: closeup.scale || 2, width: (close.w - 48) / (closeup.scale || 2) }}>{closeup.node}</div>
          </div>
        </div>
      )}
      {aside && asidePos && <div style={{ position: 'absolute', left: asidePos.x, top: asidePos.y, width: asidePos.w }}>{aside}</div>}
      {footnote && <div style={{ position: 'absolute', left: M, bottom: 28, fontSize: 12, color: t.muted }}>{footnote}</div>}
    </div>
  );
}
Object.assign(window, { WechatFrame, WechatCapsule, WechatTabBar, WechatShareCard, Showboard });

  if (kind === 'search') return (

}
const TAB3_LIST = [

          </div>

        </div>
        {/* 两个胶囊动作 */}
        <div style={{ display: 'flex', gap: 10, marginTop: 14 }}>
          <div onClick={() => s.open('category')} style={{ flex: 1, background: 'rgba(255,255,255,0.28)', border: '1.5px solid rgba(255,255,255,0.55)', borderRadius: 999, padding: '10px 0', textAlign: 'center', fontSize: 13.5, fontWeight: 700, cursor: 'pointer' }}>开一个盒子挑</div>

/* —— 手机容器 —— */
function Phone3({ initial }) {
  const [tab, setTab] = React.useState(['home', 'box', 'mine'].includes(initial) ? initial : 'home');
  const [page, setPage] = React.useState(['player', 'detail'].includes(initial) ? initial : null);
  const state = { setTab: (t) => { setTab(t); setPage(null); }, open: (p) => setPage(p), back: () => setPage(null) };
  const tabBar = { list: TAB3_LIST, color: C3.inkSoft, selectedColor: C3.berry, backgroundColor: '#FFFFFF' };
  const screens = { home: Home3Screen, box: Category3Screen, mine: Mine3Screen };
  const titles = { home: '听故事', box: '晚安盒', mine: '我的', player: '正在听', detail: '故事详情' };
  const path = { home: 'pages/index/index', box: 'pages/category/category', mine: 'pages/mine/mine', player: 'pages/player/player', detail: 'pages/detail/detail' };
  const ScreenComp = page === 'player' ? Player3Screen : page === 'detail' ? Detail3Screen : screens[tab];
  return (
    <WechatFrame
      page={path[page || tab]} title={titles[page || tab]} home={!page && tab === 'home'}
      navColor={page ? C3.sun : C3.sun} navText="black" back={!!page} onBack={state.back}
      tab={page ? undefined : tab} tabBar={page ? undefined : tabBar} onTabChange={state.setTab}
      background={C3.paper}
    >
      <ScreenComp state={state} />
    </WechatFrame>
  );
}
